name: 'novabank_analytics'

version: '1.0.0'

config-version: 2

profile: 'novabank'

model-paths:
  - models

analysis-paths:
  - analyses

test-paths:
  - tests

seed-paths:
  - seeds

macro-paths:
  - macros

snapshot-paths:
  - snapshots

target-path: target

clean-targets:
  - target
  - dbt_packages

models:

  novabank_analytics:

    staging:
      +materialized: view
      +schema: staging

    intermediate:
      +materialized: table
      +schema: intermediate

    marts:
      +materialized: table
      +schema: marts

    metrics:
      +materialized: table
      +schema: metrics

snapshots:

  novabank_analytics:
    +target_schema: snapshots

seeds:

  novabank_analytics:
    +schema: reference

vars:

  project_name: "NovaBank"

  source_system: "Databricks"

  bronze_catalog: "novabank_prod"

  silver_schema: "customer"

  transaction_schema: "transactions"

  fraud_schema: "fraud"

  risk_schema: "risk"

on-run-start:

  - "select current_timestamp()"

on-run-end:

  - "analyze table {{ this }} compute statistics"

quoting:

  database: false

  schema: false

  identifier: false
